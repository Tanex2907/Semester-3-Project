Cell id=\&quot;sAE0PSyw__k2iNOUKBVN-23\&quot; parent=\&quot;sAE0PSyw__k2iNOUKBVN-6\&quot; style=\&quot;shape=tableRow;horizontal=0;startSize=0;swimlaneHead=0;swimlaneBody=0;top=0;left=0;bottom=0;right=0;dropTarget=0;collapsible=0;recursiveResize=0;expand=0;fontStyle=1;strokeColor=inherit;fillColor=#EAF2D3;\&quot; value=\&quot;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;31\&quot; width=\&quot;340\&quot; y=\&quot;129\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-24\&quot; parent=\&quot;sAE0PSyw__k2iNOUKBVN-23\&quot; style=\&quot;connectable=0;recursiveResize=0;strokeColor=inherit;fillColor=inherit;whiteSpace=wrap;html=1;\&quot; value=\&quot;Speed measurement\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;31\&quot; width=\&quot;113\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxRectangle height=\&quot;31\&quot; width=\&quot;113\&quot; as=\&quot;alternateBounds\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-25\&quot; parent=\&quot;sAE0PSyw__k2iNOUKBVN-23\&quot; style=\&quot;connectable=0;recursiveResize=0;strokeColor=inherit;fillColor=inherit;whiteSpace=wrap;html=1;\&quot; value=\&quot;Encoder\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;31\&quot; width=\&quot;114\&quot; x=\&quot;113\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxRectangle height=\&quot;31\&quot; width=\&quot;114\&quot; as=\&quot;alternateBounds\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-26\&quot; parent=\&quot;sAE0PSyw__k2iNOUKBVN-23\&quot; style=\&quot;connectable=0;recursiveResize=0;strokeColor=inherit;fillColor=inherit;whiteSpace=wrap;html=1;\&quot; value=\&quot;Hall effect sensors\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;31\&quot; width=\&quot;113\&quot; x=\&quot;227\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxRectangle height=\&quot;31\&quot; width=\&quot;113\&quot; as=\&quot;alternateBounds\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-28\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;autosize=1;resizable=0;rotation=0;\&quot; value=\&quot;&amp;lt;div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;30\&quot; width=\&quot;20\&quot; x=\&quot;1755\&quot; y=\&quot;979\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-30\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;\&quot; value=\&quot;Above we have a small morphology chart and we are going to address the Speed measurement section. We have encoder and hall effect sensors.&amp;lt;div&amp;gt;Encoder just makes use of an encoder wheel combined with an photomicrosensor (optocoupler) while the hall effect sensors use changing magnetic field in the rotation to produce a signal.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;Since the vehicle needs to know where to go with some accuracy, it would be smarter if it travelled slower and with slow speeds, most of the time the encoder will give better outcome as it can have more resolution than the hall effect sensors. Nevertheless, they are both very useful and cheap way to measure speed.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;let us assume that we choose the encoder wheel because it is somewhat less expensive to make compared to buying magnets.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;The next step would then be to come up with specific models, it would be better if the models were quite thought through and showed all the materials, measurements and placements.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;For an encoder speed measurement, we need an optocoupler and, naturally an encoder wheel.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;Therefore, someone could hypothesize that the best material we have to use for the encoder wheel would be laser cutted wood as it has less tolerance and cheaper, faster iterations.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;Regarding the optocupler, we have to research what are limitations of optocouplers. optocouplers might lose signal if the speed of the encoder wheel is too high. Thus, we have to search which ones can work better for our conditions. Before we come up with models we should do research about the items we are using, pros and cons.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;600\&quot; width=\&quot;330\&quot; x=\&quot;1550\&quot; y=\&quot;890\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-31\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=0;\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;Meeting&amp;lt;/h1&amp;gt;&amp;lt;p&amp;gt;After the model has been tested, we could have a meeting to think about what are the possible flaws a model could have and if we could use some different components or materials. For example, if we see that encoder wheel has been done with PLA that could contain some tolerances, we should not hesitate to change it.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;It would be adviced to write everything down so we can use it on the report or to revise back our thoughts if we ever forget.&amp;lt;/p&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;205\&quot; width=\&quot;320\&quot; x=\&quot;1550\&quot; y=\&quot;1585\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-32\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=0;\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;Testing&amp;lt;/h1&amp;gt;&amp;lt;p&amp;gt;After the model is&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;&amp;amp;nbsp;thought and decided, we should test it and see if our assumptions are correct and, especially, if it even works at all. If it does not work as intended, we have to reschedule a meeting addressing a new model&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;120\&quot; width=\&quot;330\&quot; x=\&quot;1550\&quot; y=\&quot;1460\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-33\&quot; parent=\&quot;1\&quot; style=\&quot;text;strokeColor=none;fillColor=none;html=1;fontSize=27;fontStyle=1;verticalAlign=middle;align=center;autosizeText=1;\&quot; value=\&quot;Modelling\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;40\&quot; width=\&quot;160\&quot; x=\&quot;1540\&quot; y=\&quot;1140\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-34\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=0;\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;Small Reflection&amp;lt;/h1&amp;gt;&amp;lt;div&amp;gt;to optimize things it would be wise to start modelling things with higher priority first. For example, if we do not model the platform of the vehicle first, then we will not enter into the requirements for the size (W/L/H) of the vehicle, this could lead to a redesigning of all the other models.&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;140\&quot; width=\&quot;390\&quot; x=\&quot;1550\&quot; y=\&quot;1800\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sAE0PSyw__k2iNOUKBVN-35\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=0;\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 19px;&amp;quot;&amp;gt;Researching&amp;lt;/font&amp;gt;&amp;lt;/h1&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font style=&amp;quot;&amp;quot; size=&amp;quot;1&amp;quot;&amp;gt;sometimes it can be hard to find the alternative or optimal components for the requirements. Due to our inexperience we have to learn how specifications of a component work.&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font style=&amp;quot;&amp;quot; size=&amp;quot;1&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font style=&amp;quot;&amp;quot; size=&amp;quot;1&amp;quot;&amp;gt;Therefore, to spend as little time as possible with the researching part, it could be beneficial to ask chatgpt or watch youtube videos that explain what are the base specifications of a component. This can help us travel around the datasheet more confidently and faster.&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;290\&quot; width=\&quot;260\&quot; x=\&quot;1890\&quot; y=\&quot;1160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;,&quot;toolbar&quot;:&quot;pages zoom layers lightbox&quot;,&quot;page&quot;:0}"></div>
